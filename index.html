<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>授業用タイマー</title>
  
  <!-- PWA / Web App Settings for iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="授業タイマー">
  <meta name="theme-color" content="#0b0f19">

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"授業用タイマー","short_name":"タイマー","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0b0f19"}'>

  <style>
    /* Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(12px, 2vh, 24px) clamp(16px, 3vw, 32px);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.15), transparent 40%);
    }

    /* Start Screen Overlay */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #startOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px clamp(24px, 5vw, 48px);
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .start-card h1 {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-card p {
      font-size: clamp(14px, 2vw, 16px);
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-primary-lg {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #ffffff;
      font-size: clamp(18px, 2.5vw, 22px);
      font-weight: 700;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary-lg:active {
      transform: scale(0.96);
      box-shadow: 0 5px 15px rgba(6, 182, 212, 0.2);
    }

    /* Main Layout Header */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .app-title {
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e2e8f0;
    }

    .app-title span {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid rgba(129, 140, 248, 0.3);
    }

    .status-badges {
      display: flex;
      gap: 8px;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Main Timer Section */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    /* Circular Timer Container */
    .timer-container {
      position: relative;
      width: min(62vh, 82vw, 420px);
      height: min(62vh, 82vw, 420px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .timer-bg-circle {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 16;
    }

    .timer-progress-circle {
      fill: none;
      stroke: url(#timerGradient);
      stroke-width: 16;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.2s ease-out, stroke 0.3s ease;
      filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.5));
    }

    /* Center Digital Readout */
    .timer-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
    }

    .digital-time {
      font-size: clamp(52px, 12vw, 92px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .timer-sub-text {
      margin-top: 12px;
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    /* Time's Up Alarm State */
    .timer-container.time-up .timer-progress-circle {
      stroke: #ef4444 !important;
      filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.8));
    }

    .timer-container.time-up .digital-time {
      color: #ef4444 !important;
      animation: pulseAlarm 0.8s ease-in-out infinite alternate;
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.8);
    }

    .timer-container.time-up .timer-sub-text {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fca5a5;
      animation: pulseText 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulseAlarm {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.08);
        opacity: 0.85;
      }
    }

    @keyframes pulseText {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Controls Section */
    .controls-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Main Action Buttons (Start/Pause, Reset, PiP, Custom) */
    .main-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-control {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-control:active {
      transform: scale(0.95);
    }

    .btn-toggle-play {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #ffffff;
      padding: 16px 44px;
      font-size: clamp(18px, 2.5vw, 22px);
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
    }

    .btn-toggle-play.running {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
    }

    .btn-toggle-play.time-up-state {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
      animation: pulseAlarm 1s infinite alternate;
    }

    .btn-pip {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(129, 140, 248, 0.3);
      color: #a5b4fc;
    }

    .btn-pip.active {
      background: rgba(6, 182, 212, 0.2);
      border-color: rgba(6, 182, 212, 0.5);
      color: #67e8f9;
    }

    /* Add Time Quick Buttons Section */
    .time-add-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .add-time-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    @media (max-width: 600px) {
      .add-time-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .add-time-grid button:last-child {
        grid-column: span 2;
      }
    }

    .btn-add-time {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 700;
      padding: 12px 6px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-add-time:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(129, 140, 248, 0.4);
      color: #ffffff;
    }

    .btn-add-time:active {
      transform: scale(0.92);
      background: rgba(99, 102, 241, 0.3);
    }

    /* Class Presets Bar */
    .presets-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .btn-preset {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-preset:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* Hidden Canvas & Video for PiP */
    #pipCanvas, #pipVideo {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Start Overlay for Audio & WakeLock Initialization -->
  <div id="startOverlay">
    <div class="start-card">
      <h1>授業用タイマー</h1>
      <p>タップしてタイマーを起動します。<br>オーディオ有効化・全画面・自動スリープ防止が自動設定されます。</p>
      <button id="btnStartApp" class="btn-primary-lg">アプリをはじめる</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="app-title">
      授業タイマー
      <span>iPad Edition</span>
    </div>
    <div class="status-badges">
      <div id="badgeWakeLock" class="badge">
        <span class="badge-dot"></span>
        スリープ防止
      </div>
      <div id="badgePip" class="badge">
        <span class="badge-dot"></span>
        小窓表示
      </div>
    </div>
  </header>

  <!-- Main Timer View -->
  <main>
    <div id="timerContainer" class="timer-container">
      <svg class="timer-svg" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#6366f1" />
          </linearGradient>
        </defs>
        <circle class="timer-bg-circle" cx="150" cy="150" r="130" />
        <circle id="timerProgress" class="timer-progress-circle" cx="150" cy="150" r="130" stroke-dasharray="816.81" stroke-dashoffset="0" />
      </svg>

      <div class="timer-center">
        <div id="digitalDisplay" class="digital-time">05:00</div>
        <div id="statusSubText" class="timer-sub-text">準備中</div>
      </div>
    </div>
  </main>

  <!-- Controls Container -->
  <div class="controls-container">
    
    <!-- Time Addition Buttons Bar -->
    <div class="time-add-section">
      <div class="section-label">時間の追加（タップで即時延長 / タイムアップ時は自動再開）</div>
      <div class="add-time-grid">
        <button class="btn-add-time" onclick="addTimeSeconds(10)">+10秒</button>
        <button class="btn-add-time" onclick="addTimeSeconds(30)">+30秒</button>
        <button class="btn-add-time" onclick="addTimeSeconds(60)">+1分</button>
        <button class="btn-add-time" onclick="addTimeSeconds(120)">+2分</button>
        <button class="btn-add-time" onclick="addTimeSeconds(180)">+3分</button>
        <button class="btn-add-time" onclick="addTimeSeconds(300)">+5分</button>
        <button class="btn-add-time" onclick="addTimeSeconds(600)">+10分</button>
      </div>
    </div>

    <!-- Main Control Buttons -->
    <div class="main-controls">
      <button id="btnReset" class="btn-control" onclick="resetTimer()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        リセット
      </button>

      <button id="btnToggle" class="btn-control btn-toggle-play" onclick="toggleTimer()">
        <span id="btnToggleText">スタート</span>
      </button>

      <button id="btnPipToggle" class="btn-control btn-pip" onclick="togglePictureInPicture()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11V6a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2h7m8-4v5m0 0l-3-3m3 3l3-3"/></svg>
        <span id="btnPipText">縮小 (小窓表示)</span>
      </button>
    </div>

    <!-- Preset Durations -->
    <div class="presets-bar">
      <button class="btn-preset" onclick="setPreset(180)">3分</button>
      <button class="btn-preset" onclick="setPreset(300)">5分</button>
      <button class="btn-preset" onclick="setPreset(600)">10分</button>
      <button class="btn-preset" onclick="setPreset(900)">15分</button>
      <button class="btn-preset" onclick="setPreset(1200)">20分</button>
      <button class="btn-preset" onclick="setPreset(2700)">45分</button>
      <button class="btn-preset" onclick="setPreset(3000)">50分</button>
    </div>

  </div>

  <!-- Offscreen Elements for PiP API Streaming -->
  <canvas id="pipCanvas" width="512" height="512"></canvas>
  <video id="pipVideo" autoplay muted playsinline></video>

  <script>
    /* --- State Variables --- */
    let totalSeconds = 300; // Default 5 minutes
    let remainingSeconds = 300;
    let isRunning = false;
    let isTimeUp = false;
    let timerInterval = null;

    // Web Audio Context
    let audioCtx = null;
    let alarmInterval = null;

    // Screen Wake Lock
    let wakeLock = null;

    // SVG Circular calculation
    const circleRadius = 130;
    const circleCircumference = 2 * Math.PI * circleRadius; // ~816.81

    // Canvas PiP elements
    const pipCanvas = document.getElementById('pipCanvas');
    const pipCtx = pipCanvas.getContext('2d');
    const pipVideo = document.getElementById('pipVideo');
    let pipAnimationId = null;

    /* --- DOM Elements --- */
    const startOverlay = document.getElementById('startOverlay');
    const btnStartApp = document.getElementById('btnStartApp');
    const timerContainer = document.getElementById('timerContainer');
    const timerProgress = document.getElementById('timerProgress');
    const digitalDisplay = document.getElementById('digitalDisplay');
    const statusSubText = document.getElementById('statusSubText');
    const btnToggle = document.getElementById('btnToggle');
    const btnToggleText = document.getElementById('btnToggleText');
    const btnPipToggle = document.getElementById('btnPipToggle');
    const btnPipText = document.getElementById('btnPipText');
    const badgeWakeLock = document.getElementById('badgeWakeLock');
    const badgePip = document.getElementById('badgePip');

    /* --- Initialization on User Gesture --- */
    btnStartApp.addEventListener('click', async () => {
      // 1. Initialize Web Audio Context
      initAudio();

      // 2. Request Wake Lock
      await requestWakeLock();

      // 3. Request Fullscreen
      requestFullscreen();

      // 4. Hide Start Overlay
      startOverlay.classList.add('hidden');

      // 5. Setup Offscreen Canvas Stream for PiP
      setupPipCanvasStream();

      // Render initial view
      updateDisplay();
    });

    /* --- Fullscreen Helper --- */
    function requestFullscreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(() => {});
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    /* --- Web Audio API Chime Synth --- */
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChimeSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;

      // Harmony chord: C5 (523.25 Hz) & G5 (783.99 Hz) & C6 (1046.50 Hz)
      const frequencies = [523.25, 783.99, 1046.50];

      frequencies.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.12);

        // Envelope
        gain.gain.setValueAtTime(0, now + index * 0.12);
        gain.gain.linearRampToValueAtTime(0.2, now + index * 0.12 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.12 + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + index * 0.12);
        osc.stop(now + index * 0.12 + 1.25);
      });
    }

    function startAlarmLoop() {
      stopAlarmLoop();
      playChimeSound();
      alarmInterval = setInterval(() => {
        if (isTimeUp) {
          playChimeSound();
        } else {
          stopAlarmLoop();
        }
      }, 1600);
    }

    function stopAlarmLoop() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    /* --- Screen Wake Lock API --- */
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          badgeWakeLock.classList.add('active');
          wakeLock.addEventListener('release', () => {
            badgeWakeLock.classList.remove('active');
          });
        }
      } catch (err) {
        console.warn('Wake Lock request failed:', err);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    /* --- Format Time Utility --- */
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      const mm = String(mins).padStart(2, '0');
      const ss = String(secs).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    /* --- Display Update --- */
    function updateDisplay() {
      // 1. Digital Text
      digitalDisplay.textContent = formatTime(remainingSeconds);

      // 2. Circular Gauge Offset
      const progressRatio = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
      const dashoffset = circleCircumference * (1 - progressRatio);
      timerProgress.style.strokeDashoffset = dashoffset;

      // 3. Sub Text
      if (isTimeUp) {
        statusSubText.textContent = "時間切れ！";
      } else if (isRunning) {
        statusSubText.textContent = "計測中";
      } else if (remainingSeconds === totalSeconds && remainingSeconds > 0) {
        statusSubText.textContent = "準備中";
      } else {
        statusSubText.textContent = "一時停止";
      }

      // 4. Button & Container State Classes
      if (isTimeUp) {
        timerContainer.classList.add('time-up');
        btnToggle.className = 'btn-control btn-toggle-play time-up-state';
        btnToggleText.textContent = '停止';
      } else {
        timerContainer.classList.remove('time-up');
        if (isRunning) {
          btnToggle.className = 'btn-control btn-toggle-play running';
          btnToggleText.textContent = '一時停止';
        } else {
          btnToggle.className = 'btn-control btn-toggle-play';
          btnToggleText.textContent = 'スタート';
        }
      }

      // Update PiP canvas
      drawPiPCanvas();
    }

    /* --- Timer Controls --- */
    function startTimer() {
      if (isRunning || remainingSeconds <= 0) return;
      
      initAudio();
      isRunning = true;
      isTimeUp = false;

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
          if (remainingSeconds === 0) {
            triggerTimeUp();
          }
        }
      }, 1000);

      updateDisplay();
    }

    function pauseTimer() {
      isRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      updateDisplay();
    }

    function toggleTimer() {
      if (isTimeUp) {
        // Clear time up state
        resetTimer();
        return;
      }

      if (isRunning) {
        pauseTimer();
      } else {
        if (remainingSeconds > 0) {
          startTimer();
        }
      }
    }

    function resetTimer() {
      pauseTimer();
      isTimeUp = false;
      stopAlarmLoop();
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function setPreset(seconds) {
      pauseTimer();
      isTimeUp = false;
      stopAlarmLoop();
      totalSeconds = seconds;
      remainingSeconds = seconds;
      updateDisplay();
    }

    function triggerTimeUp() {
      pauseTimer();
      isTimeUp = true;
      remainingSeconds = 0;
      updateDisplay();
      startAlarmLoop();
    }

    /* --- Add Time System with Auto-Resume --- */
    function addTimeSeconds(addedSec) {
      initAudio();

      if (isTimeUp) {
        // Clear alarm & time up state immediately
        isTimeUp = false;
        stopAlarmLoop();

        // Set duration to added time and auto-resume immediately
        totalSeconds = addedSec;
        remainingSeconds = addedSec;
        startTimer();
      } else {
        // Add to active / paused timer
        remainingSeconds += addedSec;
        if (remainingSeconds > totalSeconds) {
          totalSeconds = remainingSeconds;
        }
        updateDisplay();
      }
    }

    /* --- Picture-in-Picture (PiP) & Offscreen Canvas Streaming --- */
    function setupPipCanvasStream() {
      try {
        const stream = pipCanvas.captureStream(30);
        pipVideo.srcObject = stream;
        pipVideo.play().catch(() => {});
      } catch (err) {
        console.warn('Canvas stream capture error:', err);
      }
    }

    function drawPiPCanvas() {
      const w = pipCanvas.width;
      const h = pipCanvas.height;
      const cx = w / 2;
      const cy = h / 2;

      // Background
      pipCtx.fillStyle = '#0b0f19';
      pipCtx.fillRect(0, 0, w, h);

      // Outer Glow Ring Background
      pipCtx.beginPath();
      pipCtx.arc(cx, cy, 190, 0, 2 * Math.PI);
      pipCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      pipCtx.lineWidth = 24;
      pipCtx.stroke();

      // Progress Arc
      const ratio = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + (2 * Math.PI * ratio);

      pipCtx.beginPath();
      pipCtx.arc(cx, cy, 190, startAngle, endAngle);
      pipCtx.strokeStyle = isTimeUp ? '#ef4444' : '#06b6d4';
      pipCtx.lineWidth = 24;
      pipCtx.lineCap = 'round';
      pipCtx.stroke();

      // App Title Text
      pipCtx.fillStyle = '#94a3b8';
      pipCtx.font = 'bold 24px -apple-system, sans-serif';
      pipCtx.textAlign = 'center';
      pipCtx.textBaseline = 'middle';
      pipCtx.fillText('授業タイマー', cx, cy - 90);

      // Digital Clock Text
      pipCtx.fillStyle = isTimeUp ? '#ef4444' : '#ffffff';
      pipCtx.font = 'bold 96px -apple-system, sans-serif';
      pipCtx.fillText(formatTime(remainingSeconds), cx, cy + 10);

      // Status Sub Text
      pipCtx.fillStyle = isTimeUp ? '#fca5a5' : '#67e8f9';
      pipCtx.font = 'bold 28px -apple-system, sans-serif';
      let subStr = isTimeUp ? '時間切れ！' : (isRunning ? '計測中' : '一時停止');
      pipCtx.fillText(subStr, cx, cy + 105);
    }

    async function togglePictureInPicture() {
      initAudio();

      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          if (pipVideo.readyState < 2) {
            await pipVideo.play();
          }
          await pipVideo.requestPictureInPicture();
          
          // Exit Fullscreen so iPad user can view other apps cleanly
          exitFullscreen();
        }
      } catch (err) {
        alert('お使いのブラウザはPicture-in-Picture表示に対応していないか、許可されていません。');
        console.error('PiP Error:', err);
      }
    }

    // Listen to PiP Events for Bi-directional Fullscreen Toggle
    pipVideo.addEventListener('enterpictureinpicture', () => {
      btnPipToggle.classList.add('active');
      btnPipText.textContent = '拡大 (全画面復帰)';
      badgePip.classList.add('active');
    });

    pipVideo.addEventListener('leavepictureinpicture', () => {
      btnPipToggle.classList.remove('active');
      btnPipText.textContent = '縮小 (小窓表示)';
      badgePip.classList.remove('active');

      // Re-enter Fullscreen on returning from PiP
      requestFullscreen();
    });

    // Continuously render Canvas when in PiP mode or active
    function renderLoop() {
      drawPiPCanvas();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
